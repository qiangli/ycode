# Declared operator surfaces after the YAML-native harness cutover.
# Execution capabilities are compiled from agent.yaml; this registry documents
# CLI families only and is never an authorization or tool registry.

schemaVersion: 1

capabilities:
  - id: yaml_harness
    summary: strict agent.yaml validation, schema discovery, and compiled inspection
    audience: [agent, human, ci, runtime]
    cli: [validate, schema, config]
    http: []
    config: []

  - id: lifecycle
    summary: one-shot, stdin, REPL, TUI, ACP, and configured network projections of one Harness lifecycle
    audience: [agent, human, runtime]
    cli: [prompt, repl, acp, serve]
    http: []
    config: []
    gaps:
      - network addresses, authentication, routing, triggers, and sinks are declared by agent.yaml

  - id: bashy
    summary: sole model tool and operator shell execution through compiled preflight, policy, authorization, and fencing
    audience: [agent, human]
    cli: [shell, tools]
    http: []
    config: []

  - id: resources
    summary: read-only inspection of models, skills, and memory resources compiled from agent.yaml
    audience: [human]
    cli: [model, skill, memory]
    http: []
    config: []

  - id: operability
    summary: offline documentation, compiled-harness health, feature metadata, and build identity
    audience: [agent, human, ci]
    cli: [docs, doctor, features, version]
    http: []
    config: []
