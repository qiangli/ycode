# Feature registry — user-facing inventory of capabilities reachable through
# the YAML-native harness. The binary has no behavioral build-tag variants.
# Tiers describe maturity only; they do not enable code or runtime policy.
#
# Tiers:
#   stable        — part of the supported compiled harness contract.
#   experimental  — compiled mechanism with an explicitly declared YAML use.
#   wip           — development inventory; not a supported product surface.
#
# Graduation: a feature moves wip → experimental → stable via PR. CI fails if
# tier=stable without graduation criteria satisfied.
#
# Surfaced to users via `ycode features list` / `ycode features readme`
# — keep `description` short and user-facing.

features:
  - name: yaml-harness
    tier: stable
    description: "strict agent.yaml compiler and neutral typed lifecycle kernel with Bashy as the sole model-visible tool"
    files: [internal/harness/spec, internal/harness/pipeline, internal/harness/turn]
    graduation:
      integration_test: true
      dogfood_weeks: 0
      failure_mode_doc: true

  # ─── core agent loop ──────────────────────────────────────────────────────
  - name: bash-tool
    tier: stable
    description: "compiled Bashy preflight and execution boundary with embedded-only command resolution and durable outcomes"
    files: [internal/harness/bashy]
    graduation:
      integration_test: true
      dogfood_weeks: 8
      failure_mode_doc: false

  # ─── execution & runtime ──────────────────────────────────────────────────
  - name: multi-provider
    tier: stable
    description: "Anthropic native + OpenAI-compatible covers OpenAI, xAI/Grok, DashScope/Qwen, OpenRouter, and custom HTTP providers"
    files: [internal/harness/provider, internal/api]
    graduation:
      integration_test: true
      dogfood_weeks: 8
      failure_mode_doc: false

  - name: frontend-projections
    tier: stable
    description: "compiled HTTP, WebSocket, and NATS adapters project canonical harness input and events"
    files: [internal/harness/frontend]
    graduation:
      integration_test: true
      dogfood_weeks: 4
      failure_mode_doc: false

  - name: observability
    tier: stable
    description: "OTEL client traces, metrics, and logs with local JSONL persistence and optional OTLP export"
    files: [internal/harness/observe]
    graduation:
      integration_test: true
      dogfood_weeks: 4
      failure_mode_doc: false

  # ─── orchestration ────────────────────────────────────────────────────────
  - name: agent-delegation
    tier: stable
    description: "agent.yaml roster delegation through the same typed pipeline with bounded attenuated authority"
    files: [internal/harness/agent]
    graduation:
      integration_test: true
      dogfood_weeks: 4
      failure_mode_doc: false

  - name: skills-system
    tier: stable
    description: "operator skill catalog and compiled skill execution mechanism; no specialized model-visible skill tool"
    files: [.agents/ycode/skills, internal/runtime/skillengine]
    graduation:
      integration_test: true
      dogfood_weeks: 4
      failure_mode_doc: false

  - name: yaml-hooks
    tier: stable
    description: "bounded ordered hooks declared by agent.yaml and executed as typed pipelines"
    files: [internal/harness/spec, internal/harness/pipeline]
    graduation:
      integration_test: true
      dogfood_weeks: 4
      failure_mode_doc: false

  # ─── memory & persistence ─────────────────────────────────────────────────
  - name: memory-system
    tier: stable
    description: "explicit agent.yaml recall, write, measurement, and compaction stages backed by memex"
    files: [internal/harness/stages/memory, pkg/memex/memory]
    graduation:
      integration_test: true
      dogfood_weeks: 4
      failure_mode_doc: false

  - name: durable-sessions
    tier: stable
    description: "append-only canonical events, payloads, checkpoints, and explicit compaction with no hidden session loop"
    files: [internal/harness/event, internal/harness/stages/memory]
    graduation:
      integration_test: true
      dogfood_weeks: 8
      failure_mode_doc: false

  # ─── safety & operability ─────────────────────────────────────────────────
  - name: hitl-policy
    tier: stable
    description: "monotonic agent.yaml authority attenuation, fail-closed policy, and Bashy execution fencing"
    files: [internal/harness/spec, internal/harness/stages/hitl, internal/harness/bashy]
    graduation:
      integration_test: true
      dogfood_weeks: 8
      failure_mode_doc: false

  - name: typed-failure-routing
    tier: stable
    description: "bounded retry, fallback, and outcome routing declared explicitly by typed YAML pipeline nodes"
    files: [internal/harness/pipeline]
    graduation:
      integration_test: true
      dogfood_weeks: 4
      failure_mode_doc: false

  # ─── distribution ─────────────────────────────────────────────────────────
  - name: embeddable-api
    tier: stable
    description: "`pkg/ycode/` exposes a public Go API for embedding the agent harness in other binaries"
    files: [pkg/ycode]
    graduation:
      integration_test: true
      dogfood_weeks: 4
      failure_mode_doc: false

  - name: cross-platform
    tier: stable
    description: "one static binary for linux/amd64, linux/arm64, darwin/amd64, darwin/arm64, and windows/amd64"
    files: [.goreleaser.yaml, .github/workflows/release.yml, .github/workflows/promote.yml]
    graduation:
      integration_test: true
      dogfood_weeks: 4
      failure_mode_doc: false
