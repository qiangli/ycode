<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent chat</title>
<style>
:root { --bg:#fbfaf8; --fg:#1d1d1b; --muted:#6b6962; --line:#e3e0d8; --me:#e9eef7; --agent:#ffffff; --accent:#2f5fb3; --warn:#9a3b1c; }
@media (prefers-color-scheme: dark) { :root { --bg:#161615; --fg:#ecebe6; --muted:#9c9a92; --line:#2e2d2a; --me:#1f2a3d; --agent:#1e1e1c; --accent:#8fb0ec; --warn:#e58a6a; } }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; display: flex; flex-direction: column; }
header { display: flex; gap: 12px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); }
header h1 { font-size: 15px; font-weight: 600; margin: 0; flex: 1; }
header .session { color: var(--muted); font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; }
button { font: inherit; border: 1px solid var(--line); background: var(--agent); color: var(--fg); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--bg); }
button:disabled { opacity: .5; cursor: default; }
main { flex: 1; overflow-y: auto; padding: 16px; }
.log { max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
.msg { padding: 10px 14px; border-radius: 10px; border: 1px solid var(--line); white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.user { background: var(--me); align-self: flex-end; max-width: 85%; }
.msg.agent { background: var(--agent); }
.msg.note { border: none; padding: 0 4px; color: var(--muted); font-size: 13px; }
.msg.error { color: var(--warn); border-color: var(--warn); }
form { border-top: 1px solid var(--line); padding: 12px 16px; }
form .row { max-width: 820px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; }
textarea { flex: 1; font: inherit; color: var(--fg); background: var(--agent); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; resize: vertical; min-height: 44px; max-height: 40vh; }
.empty { color: var(--muted); text-align: center; margin-top: 20vh; }
</style>
</head>
<body>
<header>
  <h1 id="title">Agent chat</h1>
  <span class="session" id="session"></span>
  <button type="button" id="new">New chat</button>
</header>
<main id="scroll"><div class="log" id="log"><p class="empty" id="empty">Ask the agent something. Enter sends, Shift+Enter adds a line.</p></div></main>
<form id="form">
  <div class="row">
    <textarea id="input" rows="2" placeholder="Message" autofocus></textarea>
    <button class="primary" id="send" type="submit">Send</button>
  </div>
</form>
<script>
(() => {
  // The bearer token arrives in the URL fragment, which the browser never
  // sends to the server; it is kept for this tab only.
  let token = "";
  const takeToken = () => {
    const fromURL = new URLSearchParams(location.hash.slice(1)).get("token");
    if (fromURL) {
      sessionStorage.setItem("token", fromURL);
      history.replaceState(null, "", location.pathname);
    }
    token = sessionStorage.getItem("token") || "";
  };
  takeToken();
  addEventListener("hashchange", takeToken);
  const $ = (id) => document.getElementById(id);
  const log = $("log"), input = $("input"), send = $("send");
  const newSession = () => (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2));
  let session = sessionStorage.getItem("session") || newSession();
  const showSession = () => { sessionStorage.setItem("session", session); $("session").textContent = session.slice(0, 8); };
  showSession();

  function add(kind, text) {
    $("empty")?.remove();
    const el = document.createElement("div");
    el.className = "msg " + kind;
    el.textContent = text;
    log.appendChild(el);
    $("scroll").scrollTop = $("scroll").scrollHeight;
    return el;
  }

  function describe(ev) {
    const data = ev.data || {};
    switch (ev.type) {
      case "output.emitted": return { kind: "agent", text: ev.output ?? "" };
      case "turn.failed": return { kind: "error", text: data.error || "the turn failed" };
      case "bashy.requested": return { kind: "note", text: "running a command…" };
      case "bashy.completed": {
        const code = data.process?.exitCode;
        return { kind: "note", text: "command finished" + (code !== undefined ? " (exit " + code + ")" : "") };
      }
      case "bashy.failed": return { kind: "note", text: "command failed" };
      case "approval.requested": return { kind: "note", text: "waiting for approval" };
      case "frontend.error": return { kind: "error", text: ev.error || "error" };
    }
    return null;
  }

  async function submit(text) {
    add("user", text);
    send.disabled = true;
    const pending = add("note", "thinking…");
    try {
      const res = await fetch(location.pathname, {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
        body: JSON.stringify({ operation: "submit", session_id: session, idempotency_key: newSession(), body: { request: text } }),
      });
      if (!res.ok) {
        pending.remove();
        add("error", res.status === 401 ? "not authorized: open the URL the server printed (it carries the token)" : (await res.text()) || res.statusText);
        return;
      }
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "", answered = false;
      for (;;) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        let nl;
        while ((nl = buffer.indexOf("\n")) >= 0) {
          const line = buffer.slice(0, nl).trim();
          buffer = buffer.slice(nl + 1);
          if (!line) continue;
          const shown = describe(JSON.parse(line));
          if (!shown) continue;
          if (shown.kind === "agent" || shown.kind === "error") { pending.remove(); answered = true; }
          if (shown.kind === "note") { pending.textContent = shown.text; continue; }
          add(shown.kind, shown.text);
        }
      }
      if (!answered) { pending.remove(); add("error", "the turn ended without an answer"); }
    } catch (err) {
      pending.remove();
      add("error", String(err));
    } finally {
      send.disabled = false;
      input.focus();
    }
  }

  $("form").addEventListener("submit", (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text || send.disabled) return;
    input.value = "";
    submit(text);
  });
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("form").requestSubmit(); }
  });
  $("new").addEventListener("click", () => {
    session = newSession();
    showSession();
    log.replaceChildren();
    input.focus();
  });
})();
</script>
</body>
</html>
