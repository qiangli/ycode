apiVersion: ycode.dev/v1alpha1
kind: Harness

metadata:
  name: ycode
  version: 1
  annotations:
    dhnt.io/purpose: canonical-self-hosting-harness

spec:
  runtime:
    defaultAgentRef: coder
    workspace: .
    readableRoots: [.]
    writableRoots: [.]
    controlRoot:
      platformDataDir: ycode/harness
    rootOverlap: deny

  sources:
    identity:
      text: You are a software-engineering agent. Use Bashy for every action.
      limits: {maxBytes: 4096}
    project-instructions:
      file: {path: AGENTS.md, required: false}
      limits: {maxBytes: 65536}
      snapshot: before-run
    final-step:
      text: This is the final permitted model step. Return the best complete answer now.
      limits: {maxBytes: 4096}

  providers:
    openai:
      protocol: openai-compatible
      endpoint:
        valueFrom:
          env: OPENAI_BASE_URL
          default: https://api.openai.com/v1
      credentials:
        apiKey:
          secretRef: {provider: env, name: OPENAI_API_KEY}
      transport:
        connectTimeoutMs: 10000
        requestTimeoutMs: 120000
        maxResponseBytes: 16777216

  models:
    primary:
      providerRef: openai
      id: gpt-5.6
      limits:
        contextTokens: 128000
        maxOutputTokens: 16384
      capabilities:
        streaming: true
        toolCalls: true
        parallelToolCalls: true
        structuredOutput: true

  routes:
    main:
      attempts:
        - modelRef: primary
          transportRetry:
            maxAttempts: 2
            backoff: {initialMs: 250, multiplier: 2, maxMs: 2000, jitter: full}
            retryOn: [transport, rate-limit, server, stream-before-first-event]
          timeoutMs: 120000
      fallbackOn: [transport-exhausted, rate-limit-exhausted, server-exhausted]
      providerSession: turn
      budget:
        maxInputTokens: 500000
        maxOutputTokens: 100000
        maxCostUSD: 25
      quotaPool: {strategy: least-used, onExhausted: fail}

  bashy:
    contract: bashy-run-v1
    requestType: ycode.bashy-request/v1
    resultType: ycode.bashy-result/v1
    operations: [execute, start, poll, signal, cancel]
    execution:
      cwdRoot: workspace
      environment:
        inherit: allowlist
        names: [PATH, LANG, LC_ALL, TERM]
      commandResolution: embedded-and-pinned-only
      timeoutMs: 60000
      jobLifetimeMs: 900000
      maxOutputChars: 32768
      maxSpillBytes: 16777216
      maxParallel: 2
      permissionCeiling: workspace-write
      effectsCeiling: [read, write, exec, net]
      preflight: required
      incompletePreflight: deny
      hostFallback: deny

  contexts:
    coding:
      fragments:
        - id: identity
          sourceRef: identity
          role: system
          cache: {scope: stable, breakAfter: true}
        - id: project
          sourceRef: project-instructions
          role: system
          cache: {scope: workspace, breakAfter: true}
      budget: {maxTokens: 16000, overflow: fail}

  memories:
    main:
      provider: memex
      recall:
        scopes: [workspace, agent]
        ranking: hybrid
        maxItems: 8
        maxTokens: 3000
      write:
        maxItems: 16
        maxBytes: 65536
      compaction:
        preserveRecentTokens: 24000
        routeRef: main
        onFailure: preserve-original

  queues:
    interactive:
      store: {controlPath: queues/interactive}
      discipline: priority-fifo
      capacity: 100
      overflow: reject-new
      priorities: {interrupt: 100, steering: 80, user: 50, scheduled: 10}
      leaseMs: 120000
      staleLease: requeue
      deduplicateBy: idempotency-key

  sessions:
    durable:
      events:
        format: ycode-event-v1
        store: jsonl
        directory: {controlPath: sessions}
        fsync: each-event
        permissions: {directory: 0700, file: 0600}
        sequence: monotonic-per-branch
        integrity: hash-chain
      payloads:
        store: content-addressed
        directory: {controlPath: payloads}
        digest: sha256
        inlineMaxBytes: 4096
        retainModelVisibleBytes: true
      checkpoints:
        directory: {controlPath: checkpoints}
        bind: [config-digest, event-sequence, typed-state, leases, placement]
      branches: {enabled: true, copyEvents: through-checkpoint}
      retention: {maxAgeDays: 90, maxBytes: 1073741824, preserveReferencedPayloads: true}

  lifecycles:
    turn:
      initial: admitted
      terminal: [completed, failed, cancelled]
      transitions:
        - {from: admitted, to: running}
        - {from: running, to: waiting-human}
        - {from: waiting-human, to: running}
        - {from: running, to: completed}
        - {from: running, to: failed}
        - {from: running, to: cancelled}

  policies:
    workspace:
      unavailableHuman: deny
      incompletePreflight: deny
      rules:
        - id: unsupported
          match: {preflightComplete: false}
          decision: deny
        - id: destructive
          match: {effectsAny: [destroy, priv, persist, cred]}
          decision: ask
        - id: network-or-remote
          match: {effectsAny: [net, remote, spend]}
          decision: ask
        - id: workspace-work
          match:
            effectsAllWithin: [read, write, exec]
            pathsAllWithin: [workspace]
          decision: allow
        - id: default
          match: {always: true}
          decision: deny
      resume: [approve, edit, reject]
      maxEdits: 2
      approvalBinding: execution-context-digest-v1

  placements:
    local-workspace:
      kind: local
      workspace: runtime
      isolation: workspace
      mounts: [workspace]
      network: policy
      supportedPlatforms: [darwin-amd64, darwin-arm64, linux-amd64, linux-arm64, windows-amd64]
      unsupportedEffect: reject

  locks:
    mutation:
      backend: session-store
      resourceKey: {literal: global-workspace-mutation}
      mode: exclusive
      leaseMs: 120000
      renewEveryMs: 30000
      fencing: monotonic
      onTimeout: fail

  hooks:
    after-tool-audit:
      phase: after-bashy-execute
      pipelineRef: audit-tool
      inputType: ycode.tool-audit/v1
      outputType: ycode.tool-audit/v1
      order: 10
      maxInvocations: 25
      reentrant: false
      failure: fail

  pipelines:
    audit-tool:
      exported: true
      inputs: {audit: ycode.tool-audit/v1}
      state: {}
      outputs: {audit: ycode.tool-audit/v1}
      concurrency: 1
      failFast: true
      nodes:
        - id: record
          needs: []
          run:
            stage: event.annotate
            in: {value: audit}
            out: {value: audit}

    compact-state:
      inputs: {state: ycode.agent-loop/v1}
      state:
        compacted: {type: ycode.agent-loop/v1, writer: single}
      outputs: {state: ycode.agent-loop/v1}
      concurrency: 1
      failFast: true
      nodes:
        - id: checkpoint
          needs: []
          run:
            stage: checkpoint.save
            with: {sessionRef: durable, reason: compaction}
            in: {state: state}
            out: {checkpoint: compacted.checkpoint}
        - id: compact
          needs: [checkpoint]
          run:
            stage: memory.compact
            with: {memoryRef: main}
            in: {state: state, checkpoint: compacted.checkpoint}
            out: {state: state}

    preserve-state:
      inputs: {state: ycode.agent-loop/v1}
      state: {}
      outputs: {state: ycode.agent-loop/v1}
      concurrency: 1
      failFast: true
      nodes:
        - id: forward
          needs: []
          run:
            stage: state.forward
            in: {value: state}
            out: {value: state}

    finish-step:
      inputs: {state: ycode.agent-loop/v1}
      state: {}
      outputs: {state: ycode.agent-loop/v1}
      concurrency: 1
      failFast: true
      nodes:
        - id: finish
          needs: []
          run:
            stage: loop.finish
            in: {state: state}
            out: {state: state}

    invalid-step:
      inputs: {state: ycode.agent-loop/v1}
      state: {}
      outputs: {state: ycode.agent-loop/v1}
      concurrency: 1
      failFast: true
      nodes:
        - id: fail
          needs: []
          run:
            stage: outcome.fail
            with: {class: invalid-model-step}
            in: {state: state}
            out: {state: state}

    allow-command:
      inputs: {state: ycode.command-state/v1}
      state:
        lock: {type: ycode.lock-lease/v1, writer: single}
      outputs: {state: ycode.command-state/v1}
      concurrency: 1
      failFast: false
      nodes:
        - id: acquire
          needs: []
          run:
            stage: lock.acquire
            with: {lockRef: mutation}
            out: {lease: lock}
        - id: execute
          needs: [acquire]
          run:
            stage: bashy.execute
            in:
              intent: state.intent
              authorization: state.authorization
              fencingToken: lock.fencingToken
            out: {result: state.result}
        - id: release
          needs: [execute]
          runOn: [succeeded, observed, failed]
          run:
            stage: lock.release
            with: {lockRef: mutation}
            in: {lease: lock}
        - id: terminal
          needs: [release]
          run:
            stage: command.finish
            in: {state: state}
            out: {state: state}

    deny-command:
      inputs: {state: ycode.command-state/v1}
      state: {}
      outputs: {state: ycode.command-state/v1}
      concurrency: 1
      failFast: true
      nodes:
        - id: deny
          needs: []
          run:
            stage: bashy.deny
            in: {intent: state.intent, decision: state.policy}
            out: {result: state.result, terminal: state.terminal}

    approve-command:
      inputs: {state: ycode.command-state/v1}
      state: {}
      outputs: {state: ycode.command-state/v1}
      concurrency: 1
      failFast: true
      nodes:
        - id: bind
          needs: []
          run:
            stage: policy.bind-approval
            in: {state: state}
            out: {state: state}
        - id: execute
          needs: [bind]
          run:
            pipelineRef: allow-command
            in: {state: state}
            out: {state: state}

    reject-command:
      inputs: {state: ycode.command-state/v1}
      state: {}
      outputs: {state: ycode.command-state/v1}
      concurrency: 1
      failFast: true
      nodes:
        - id: reject
          needs: []
          run:
            stage: bashy.reject
            in: {intent: state.intent, resolution: state.resolution}
            out: {result: state.result, terminal: state.terminal}

    edit-command:
      inputs: {state: ycode.command-state/v1}
      state: {}
      outputs: {state: ycode.command-state/v1}
      concurrency: 1
      failFast: true
      nodes:
        - id: edit
          needs: []
          run:
            stage: command.apply-edit
            in: {state: state, editedIntent: state.resolution.editedIntent}
            out: {state: state}

    ask-command:
      inputs: {state: ycode.command-state/v1}
      state: {}
      outputs: {state: ycode.command-state/v1}
      concurrency: 1
      failFast: true
      nodes:
        - id: checkpoint
          needs: []
          run:
            stage: checkpoint.save
            with: {sessionRef: durable, reason: hitl}
            in: {state: state}
            out: {checkpoint: state.checkpoint}
        - id: waiting
          needs: [checkpoint]
          run:
            stage: lifecycle.transition
            with: {lifecycleRef: turn, to: waiting-human}
        - id: review
          needs: [waiting]
          run:
            stage: hitl.review
            with: {unavailable: deny, oneUseDecision: true}
            in:
              checkpoint: state.checkpoint
              intent: state.intent
              preflight: state.preflight
              decision: state.policy
            out: {resolution: state.resolution}
        - id: running
          needs: [review]
          run:
            stage: lifecycle.transition
            with: {lifecycleRef: turn, to: running}
        - id: resolve
          needs: [running]
          run:
            switch:
              cases:
                - when: {eq: [{field: state.resolution.action}, {literal: approve}]}
                  pipelineRef: approve-command
                - when: {eq: [{field: state.resolution.action}, {literal: edit}]}
                  pipelineRef: edit-command
                - when: {eq: [{field: state.resolution.action}, {literal: reject}]}
                  pipelineRef: reject-command
              noMatch: fail
              in: {state: state}
              out: {state: state}

    command-attempt:
      inputs: {state: ycode.command-state/v1}
      state: {}
      outputs: {state: ycode.command-state/v1}
      concurrency: 1
      failFast: true
      nodes:
        - id: preflight
          needs: []
          run:
            stage: bashy.preflight
            in: {intent: state.intent}
            out: {report: state.preflight}
        - id: evaluate
          needs: [preflight]
          run:
            stage: policy.evaluate
            with: {policyRef: workspace, placementRef: local-workspace}
            in: {intent: state.intent, preflight: state.preflight}
            out: {decision: state.policy, authorization: state.authorization}
        - id: decide
          needs: [evaluate]
          run:
            switch:
              cases:
                - when: {eq: [{field: state.policy.decision}, {literal: allow}]}
                  pipelineRef: allow-command
                - when: {eq: [{field: state.policy.decision}, {literal: ask}]}
                  pipelineRef: ask-command
                - when: {eq: [{field: state.policy.decision}, {literal: deny}]}
                  pipelineRef: deny-command
              noMatch: fail
              in: {state: state}
              out: {state: state}

    execute-one-tool:
      inputs: {call: ycode.bashy-call/v1}
      state:
        command: {type: ycode.command-state/v1, writer: loop-carried}
      outputs: {result: ycode.bashy-result/v1}
      concurrency: 1
      failFast: true
      nodes:
        - id: initialize
          needs: []
          run:
            stage: command.initialize
            with: {maxEdits: 2}
            in: {call: call}
            out: {state: command}
        - id: guard-and-run
          needs: [initialize]
          run:
            repeat:
              pipelineRef: command-attempt
              maxIterations: 3
              carry: {state: command}
              until: {eq: [{field: command.terminal}, {literal: true}]}
              out: {state: command}
        - id: audit
          needs: [guard-and-run]
          run:
            hook.invoke: after-tool-audit
            in: {audit: command.audit}
            out: {audit: command.audit}
        - id: result
          needs: [audit]
          run:
            stage: state.project
            in: {value: command.result}
            out: {value: result}

    execute-tool-calls:
      inputs:
        state: ycode.agent-loop/v1
        calls: ycode.bashy-calls/v1
      state:
        results: {type: ycode.bashy-results/v1, writer: single, merge: input-order}
        steering: {type: ycode.queue-items/v1, writer: single}
      outputs: {state: ycode.agent-loop/v1}
      concurrency: 2
      failFast: true
      nodes:
        - id: execute
          needs: []
          run:
            forEach:
              items: {field: calls}
              as: call
              maxItems: 16
              maxParallel: 2
              ordered: true
              pipelineRef: execute-one-tool
              in: {call: call}
              collect: {result: results}
        - id: append-results
          needs: [execute]
          run:
            stage: messages.append-tool-results
            in: {state: state, results: results}
            out: {state: state}
        - id: drain-after-tool
          needs: [append-results]
          run:
            stage: queue.drain
            with: {queueRef: interactive, classes: [interrupt, steering]}
            out: {items: steering}
        - id: apply-steering
          needs: [drain-after-tool]
          run:
            stage: messages.apply-input
            in: {state: state, items: steering}
            out: {state: state}

    agent-step:
      inputs: {state: ycode.agent-loop/v1}
      state:
        steering: {type: ycode.queue-items/v1, writer: single}
        prepared: {type: ycode.agent-loop/v1, writer: single}
      outputs: {state: ycode.agent-loop/v1}
      concurrency: 1
      failFast: true
      nodes:
        - id: drain-before-model
          needs: []
          run:
            stage: queue.drain
            with: {queueRef: interactive, classes: [interrupt, steering]}
            out: {items: steering}
        - id: apply-steering
          needs: [drain-before-model]
          run:
            stage: messages.apply-input
            in: {state: state, items: steering}
            out: {state: state}
        - id: measure
          needs: [apply-steering]
          run:
            stage: context.measure
            in: {messages: state.messages}
            out: {tokens: state.contextTokens}
        - id: prepare
          needs: [measure]
          run:
            switch:
              cases:
                - when: {gte: [{field: state.contextTokens}, {literal: 90000}]}
                  pipelineRef: compact-state
              defaultPipelineRef: preserve-state
              in: {state: state}
              out: {state: prepared}
        - id: final-instruction
          needs: [prepare]
          when: {eq: [{field: prepared.remainingIterations}, {literal: 1}]}
          run:
            stage: messages.append-source
            with: {sourceRef: final-step, role: system}
            in: {state: prepared}
            out: {state: prepared}
        - id: model
          needs: [prepare, final-instruction]
          acceptsSkipped: [final-instruction]
          run:
            stage: llm.call
            with:
              routeRef: main
              tool: bashy
              responseType: ycode.provider-response/v1
            in: {messages: prepared.messages, providerSession: prepared.providerSession}
            out: {response: prepared.response, providerSession: prepared.providerSession}
        - id: normalize
          needs: [model]
          run:
            stage: messages.normalize-provider-response
            with:
              deterministicCallIds: true
              duplicateCalls: drop-identical
              malformedToolResult: repair-explicitly
            in: {state: prepared, response: prepared.response}
            out: {state: prepared}
        - id: append-assistant
          needs: [normalize]
          run:
            stage: messages.append-assistant
            in: {state: prepared, response: prepared.response}
            out: {state: prepared}
        - id: dispatch
          needs: [append-assistant]
          run:
            switch:
              cases:
                - when: {eq: [{field: prepared.response.hasToolCalls}, {literal: true}]}
                  pipelineRef: execute-tool-calls
                  in: {state: prepared, calls: prepared.response.toolCalls}
                - when: {eq: [{field: prepared.response.finished}, {literal: true}]}
                  pipelineRef: finish-step
                  in: {state: prepared}
              defaultPipelineRef: invalid-step
              in: {state: prepared}
              out: {state: state}

    turn:
      inputs: {request: ycode.input/v1}
      state:
        input: {type: ycode.input/v1, writer: single}
        context: {type: ycode.context/v1, writer: single}
        memory: {type: ycode.memory-items/v1, writer: single}
        probe: {type: string, writer: single}
        loop: {type: ycode.agent-loop/v1, writer: loop-carried}
      outputs: {output: ycode.output/v1}
      concurrency: 4
      failFast: true
      nodes:
        - id: running
          needs: []
          run:
            stage: lifecycle.transition
            with: {lifecycleRef: turn, from: admitted, to: running}
        - id: input
          needs: [running]
          run:
            stage: input.normalize
            in: {request: request}
            out: {input: input}
        - id: context
          needs: [input]
          run:
            stage: context.load
            with: {contextRef: coding}
            out: {context: context}
        # Harness-authored Bashy call: same preflight -> policy -> digest-bound
        # execution path as a model tool call. Inputs arrive as YCODE_IN_<PORT>
        # env scalars plus one stdin JSON object; stdout lands in the out port.
        - id: workspace-probe
          needs: [input]
          run:
            stage: bashy.run
            with:
              script: "printf 'workspace-ready'"
              timeoutMs: 5000
              effects: [read]
            in: {request: input}
            out: {probe: probe}
        - id: recall
          needs: [input]
          run:
            stage: memory.recall
            with: {memoryRef: main}
            in: {query: input}
            out: {items: memory}
        - id: assemble
          needs: [context, recall]
          run:
            stage: prompt.assemble
            with: {order: [context, memory, input]}
            in: {input: input, context: context, memory: memory}
            out: {state: loop}
        - id: checkpoint
          needs: [assemble]
          run:
            stage: checkpoint.save
            with: {sessionRef: durable, reason: before-agent-loop}
            in: {state: loop}
            out: {checkpoint: loop.checkpoint}
        - id: loop
          needs: [checkpoint]
          run:
            repeat:
              pipelineRef: agent-step
              maxIterations: 25
              carry: {state: loop}
              until: {eq: [{field: loop.finished}, {literal: true}]}
              out: {state: loop}
        - id: remember
          needs: [loop]
          run:
            stage: memory.write
            with: {memoryRef: main}
            in: {messages: loop.messages}
        - id: output
          needs: [loop]
          run:
            stage: output.emit
            with: {sinkRefs: [primary-output]}
            in: {messages: loop.messages}
            out: {output: output}
        - id: completed
          needs: [remember, output]
          run:
            stage: lifecycle.transition
            with: {lifecycleRef: turn, from: running, to: completed}

  agents:
    coder:
      displayName: Ycode Coder
      description: General software-engineering agent using one governed Bashy tool.
      inputSchema:
        type: object
        additionalProperties: false
        properties:
          request: {type: string, minLength: 1}
        required: [request]
      outputSchema:
        type: object
        additionalProperties: false
        properties:
          text: {type: string}
        required: [text]
      contextRef: coding
      modelRouteRef: main
      pipelineRef: turn
      memoryRef: main
      queueRef: interactive
      sessionRef: durable
      policyRef: workspace
      placementRef: local-workspace
      lifecycleRef: turn
      hookRefs: [after-tool-audit]
      permissionCeiling: workspace-write
      effectsCeiling: [read, write, exec, net]
      delegations:
        - agentRef: reviewer
          modelRouteRef: main
          maxDepth: 1
          maxParallel: 2
          timeoutMs: 120000
          permissionCeiling: read-only
          effectsCeiling: [read]
          budget: {maxInputTokens: 100000, maxOutputTokens: 20000, maxCostUSD: 5}
          session: {branch: child, join: handoff, cancel: with-parent}
      presentation: {icon: code, category: engineering}
    reviewer:
      displayName: Ycode Reviewer
      description: Read-only review agent.
      inputSchema:
        type: object
        additionalProperties: false
        properties:
          request: {type: string, minLength: 1}
        required: [request]
      outputSchema:
        type: object
        additionalProperties: false
        properties:
          text: {type: string}
        required: [text]
      contextRef: coding
      modelRouteRef: main
      pipelineRef: turn
      memoryRef: main
      queueRef: interactive
      sessionRef: durable
      policyRef: workspace
      placementRef: local-workspace
      lifecycleRef: turn
      hookRefs: [after-tool-audit]
      permissionCeiling: read-only
      effectsCeiling: [read]
      delegations: []
      presentation: {icon: search, category: engineering}

  frontends:
    one-shot:
      kind: one-shot
      trust: local-user
      limits: {maxInputBytes: 1048576}
    repl:
      kind: repl
      trust: local-user
      hitl: true
      limits: {maxInputBytes: 1048576}
    tui:
      kind: tui
      trust: local-user
      hitl: true
      limits: {maxInputBytes: 1048576}
    http:
      kind: http
      listen: {network: tcp, address: "127.0.0.1:31415"}
      tls: {mode: disabled-loopback-only}
      auth: {mode: bearer, secretRef: {provider: env, name: YCODE_HTTP_TOKEN}}
      limits: {maxInputBytes: 1048576, maxConcurrent: 32}
    websocket:
      kind: websocket
      listen: {network: tcp, address: "127.0.0.1:31416"}
      tls: {mode: disabled-loopback-only}
      auth: {mode: bearer, secretRef: {provider: env, name: YCODE_WS_TOKEN}}
      limits: {maxInputBytes: 1048576, maxConcurrent: 32}
    nats:
      kind: nats
      endpoint: nats://127.0.0.1:4222
      tls: {mode: disabled-loopback-only}
      auth: {mode: token, secretRef: {provider: env, name: YCODE_NATS_TOKEN}}
      subject: ycode.input
      limits: {maxInputBytes: 1048576, maxConcurrent: 32}
    acp:
      kind: acp
      transport: stdio
      trust: local-user
      resume: true
      fork: true
      limits: {maxInputBytes: 1048576}
    embed:
      kind: go-embed
      trust: caller
      limits: {maxInputBytes: 1048576}

  triggers:
    interactive-input:
      kind: frontend
      frontendRefs: [one-shot, repl, tui, http, websocket, nats, acp, embed]
      route:
        agentRef: coder
        queueRef: interactive
      inputMapping: canonical-v1
      idempotency: required
      admission: {maxPendingPerPrincipal: 16, onLimit: reject}

  sinks:
    primary-output:
      kind: frontend-response
      frontendRefs: [one-shot, repl, tui, http, websocket, nats, acp, embed]
      destinationAllowlist: [originating-frontend]
      redact: secrets-and-control-paths
      delivery:
        mode: at-least-once
        deduplicateBy: event-id
        retry: {maxAttempts: 3, backoffMs: 250, maxBackoffMs: 2000}
        deadLetter: {controlPath: dead-letter}

  observability:
    enabled: true
    exporter: otlp
    endpoint:
      valueFrom:
        env: OTEL_EXPORTER_OTLP_ENDPOINT
        default: ""
    recordContent: false
    attributes: {service.name: ycode}

  extensions: {}
