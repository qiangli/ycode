apiVersion: ycode.dev/v1alpha1
kind: Harness
metadata: {name: reconstruction-opencode-like, version: 1, annotations: {dhnt.io/profile: opencode-like, dhnt.io/compatibility: behavioral, dhnt.io/bashy-command-kit: portable-v1}}
spec:
  runtime: {defaultAgentRef: coder, workspace: ., readableRoots: [.], writableRoots: [.], controlRoot: {platformDataDir: ycode/reconstruction-opencode}, rootOverlap: deny}
  sources: {identity: {text: "Measure context and apply an explicit step cap before Bashy.", limits: {maxBytes: 4096}}}
  providers: {mock: {protocol: mock, endpoint: {valueFrom: {env: YCODE_MOCK_ENDPOINT, default: "mock://local"}}, credentials: {apiKey: {secretRef: {provider: env, name: YCODE_MOCK_KEY}}}, transport: {connectTimeoutMs: 10, requestTimeoutMs: 1000, maxResponseBytes: 1048576}}}
  models: {deterministic: {providerRef: mock, id: deterministic-v1, limits: {contextTokens: 4096, maxOutputTokens: 256}, capabilities: {streaming: true, toolCalls: true, parallelToolCalls: false, structuredOutput: true}}}
  routes: {main: {attempts: [{modelRef: deterministic, transportRetry: {maxAttempts: 1, backoff: {initialMs: 1, multiplier: 1, maxMs: 1, jitter: none}, retryOn: []}, timeoutMs: 1000}], fallbackOn: [], providerSession: turn, budget: {maxInputTokens: 4096, maxOutputTokens: 256, maxCostUSD: 1}, quotaPool: {strategy: ordered, onExhausted: fail}}}
  bashy: {contract: bashy-run-v1, requestType: ycode.bashy-call/v1, resultType: ycode.bashy-result/v1, operations: [execute], execution: {cwdRoot: ., environment: {inherit: allowlist, names: []}, commandResolution: embedded-only, timeoutMs: 1000, jobLifetimeMs: 1000, maxOutputChars: 4096, maxSpillBytes: 8192, maxParallel: 1, permissionCeiling: read-only, effectsCeiling: [read, exec], preflight: required, incompletePreflight: deny, hostFallback: deny}}
  contexts: {coding: {fragments: [{id: identity, sourceRef: identity, role: system, cache: {scope: step, breakAfter: false}}], budget: {maxTokens: 512, overflow: fail}}}
  pipelines:
    turn:
      inputs: {request: ycode.input/v1}
      state: {input: {type: ycode.input/v1, writer: single}, messages: {type: ycode.messages/v1, writer: single}, tokens: {type: ycode.tokens/v1, writer: single}, checkpoint: {type: ycode.checkpoint/v1, writer: single}, providerSession: {type: ycode.provider-session/v1, writer: single}, response: {type: ycode.provider-response/v1, writer: single}, intent: {type: ycode.bashy-call/v1, writer: single}, report: {type: ycode.preflight/v1, writer: single}, authorization: {type: ycode.authorization/v1, writer: single}, fencingToken: {type: ycode.fencing/v1, writer: single}, result: {type: ycode.bashy-result/v1, writer: single}, output: {type: ycode.output/v1, writer: single}}
      outputs: {output: ycode.output/v1}
      concurrency: 1
      failFast: true
      nodes:
        - {id: input, needs: [], run: {stage: input.normalize, in: {request: request}, out: {input: input}}}
        - {id: messages, needs: [input], run: {stage: state.forward, in: {value: input}, out: {value: messages}}}
        - {id: measure, needs: [messages], run: {stage: context.measure, in: {messages: messages}, out: {tokens: tokens}}}
        - {id: checkpoint, needs: [measure], run: {stage: checkpoint.save, in: {state: messages}, out: {checkpoint: checkpoint}}}
        - {id: compact, needs: [checkpoint], run: {stage: memory.compact, in: {state: messages, checkpoint: checkpoint}, out: {state: messages}}}
        - {id: provider-session, needs: [compact], run: {stage: state.forward, in: {value: input}, out: {value: providerSession}}}
        - {id: model, needs: [provider-session], run: {stage: llm.call, with: {routeRef: main}, in: {messages: messages, providerSession: providerSession}, out: {response: response, providerSession: providerSession}}}
        - {id: intent, needs: [model], run: {stage: state.forward, in: {value: response}, out: {value: intent}}}
        - {id: preflight, needs: [intent], run: {stage: bashy.preflight, in: {intent: intent}, out: {report: report}}}
        - {id: authorization, needs: [preflight], run: {stage: state.forward, in: {value: report}, out: {value: authorization}}}
        - {id: fencing, needs: [preflight], run: {stage: state.forward, in: {value: report}, out: {value: fencingToken}}}
        - {id: execute, needs: [authorization, fencing], run: {stage: bashy.execute, in: {intent: intent, authorization: authorization, fencingToken: fencingToken}, out: {result: result}}}
        - {id: output, needs: [execute], run: {stage: output.emit, in: {messages: result}, out: {output: output}}}
  agents: {coder: {displayName: OpenCode-like, description: reconstruction, inputSchema: {type: object}, outputSchema: {type: object}, contextRef: coding, modelRouteRef: main, pipelineRef: turn, permissionCeiling: read-only, effectsCeiling: [read], delegations: [], presentation: {icon: terminal, category: engineering}}}
  observability: {enabled: false, exporter: none, endpoint: {valueFrom: {env: OTEL_EXPORTER_OTLP_ENDPOINT, default: ""}}, recordContent: false, attributes: {}}
