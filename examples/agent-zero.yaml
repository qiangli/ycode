# Lean one-shot baseline: no declared context, memory, session history, or repeat loop.
# toolCalls is false, so the model receives no Bashy tool and cannot answer
# requests that require running a command (for example, reporting the cwd).
# Every prompt is independent; prior turns are not loaded or retained.
apiVersion: ycode.dev/v1alpha1
kind: Harness
metadata:
  name: zero-agent
  version: 1
spec:
  interfaces:
    cli:
      identity: {name: zero-agent, version: build, compatibility: "One-shot benchmark baseline"}
      bootstrap: {configFlags: [--file, -f], defaultFile: examples/agent-zero.yaml}
      presentation:
        formats: [text, json]
        defaultFormat: text
        color: never
        quiet: false
        redact: compiled
        help: {flag: help, shorthand: h, flagUsage: Show help, template: "{{.UsageString}}", usageTemplate: "Usage: {{.UseLine}}"}
        errors: {prefix: "error: ", usage: false}
      exitCodes: {success: 0, usage: 2, configuration: 3, runtime: 1, unsupported: 4, interrupted: 130}
      root:
        name: zero-agent
        usage: zero-agent [prompt]
        short: Run the zero-capability baseline
        args: {min: 0, max: -1}
        flags:
          - {name: file, shorthand: f, type: string, default: examples/agent-zero.yaml, usage: Harness YAML file, scope: inherited}
        dispatch:
          operation: input
          frontendRef: one-shot
          triggerRef: input
          agentRef: zero
          input: {mode: auto, stdin: true, empty: reject, payloadKey: request}
        commands:
          - {name: validate, short: Validate the harness, args: {min: 0, max: 0}, dispatch: {operation: validate}}
          - {name: help, usage: "help [command]", short: Show help, args: {min: 0, max: -1}, dispatch: {operation: help}}
  runtime:
    defaultAgentRef: zero
    workspace: .
    readableRoots: [.]
    writableRoots: [.]
    controlRoot: {platformDataDir: ycode/zero-agent}
    rootOverlap: deny
  providers:
    mock:
      protocol: openai-compatible
      endpoint: {valueFrom: {env: OPENAI_BASE_URL, default: "https://api.openai.com/v1"}}
      credentials: {apiKey: {secretRef: {provider: env, name: OPENAI_API_KEY}}}
      transport: {connectTimeoutMs: 10, requestTimeoutMs: 1000, maxResponseBytes: 1048576}
  models:
    no-tools:
      providerRef: mock
      id: gpt-5.6
      limits: {contextTokens: 4096, maxOutputTokens: 256}
      capabilities: {streaming: true, toolCalls: false, parallelToolCalls: false, structuredOutput: false}
  routes:
    main:
      attempts:
        - modelRef: no-tools
          transportRetry: {maxAttempts: 1, backoff: {initialMs: 1, multiplier: 1, maxMs: 1, jitter: none}, retryOn: []}
          timeoutMs: 1000
      fallbackOn: []
      providerSession: turn
      budget: {maxInputTokens: 4096, maxOutputTokens: 256, maxCostUSD: 1}
      quotaPool: {strategy: ordered, onExhausted: fail}
  # Bashy is a required harness execution boundary, but toolCalls=false means
  # the model cannot invoke it. No pipeline stage below creates a Bashy call.
  bashy:
    contract: bashy-run-v1
    requestType: ycode.bashy-call/v1
    resultType: ycode.bashy-result/v1
    operations: [execute]
    execution: {cwdRoot: ., environment: {inherit: allowlist, names: []}, commandResolution: embedded-only, timeoutMs: 1000, jobLifetimeMs: 1000, maxOutputChars: 4096, maxSpillBytes: 8192, maxParallel: 1, permissionCeiling: read-only, effectsCeiling: [read], preflight: required, incompletePreflight: deny, hostFallback: deny}
  pipelines:
    one-shot:
      inputs: {request: ycode.input/v1}
      state:
        input: {type: ycode.input/v1, writer: single}
        messages: {type: ycode.messages/v1, writer: single}
        providerSession: {type: ycode.provider-session/v1, writer: single}
        response: {type: ycode.provider-response/v1, writer: single}
        finalMessages: {type: ycode.messages/v1, writer: single}
        output: {type: ycode.output/v1, writer: single}
      outputs: {output: ycode.output/v1}
      concurrency: 1
      failFast: true
      nodes:
        - id: input
          needs: []
          run: {stage: input.normalize, in: {request: request}, out: {input: input}}
        - id: assemble
          needs: [input]
          run: {stage: prompt.assemble, with: {order: [input]}, in: {input: input}, out: {state: messages}}
        - id: provider-session
          needs: [input]
          run: {stage: state.forward, in: {value: input}, out: {value: providerSession}}
        - id: answer
          needs: [assemble, provider-session]
          run: {stage: llm.call, with: {routeRef: main}, in: {messages: messages.messages, providerSession: providerSession}, out: {response: response, providerSession: providerSession}}
        - id: append-answer
          needs: [answer]
          run: {stage: messages.append-assistant, in: {state: messages, response: response}, out: {state: finalMessages}}
        - id: emit
          needs: [append-answer]
          run: {stage: output.emit, in: {messages: finalMessages.messages}, out: {output: output}}
  agents:
    zero:
      displayName: Zero baseline
      description: Independent one-shot requests; no context, conversation history, persistent memory, repeat loop, or model-visible tool.
      inputSchema: {type: object}
      outputSchema: {type: object}
      modelRouteRef: main
      pipelineRef: one-shot
      permissionCeiling: read-only
      effectsCeiling: [read]
      delegations: []
      presentation: {icon: terminal, category: benchmark}
  frontends:
    one-shot: {kind: one-shot, trust: local-user, limits: {maxInputBytes: 1048576}}
  triggers:
    input:
      kind: frontend
      frontendRefs: [one-shot]
      route: {agentRef: zero}
      inputMapping: canonical-v1
      idempotency: required
      admission: {maxPendingPerPrincipal: 1, onLimit: reject}
  observability: {enabled: false, exporter: none, endpoint: {valueFrom: {env: OTEL_EXPORTER_OTLP_ENDPOINT, default: ""}}, recordContent: false, attributes: {}}
