# ycode release configuration — consumed by `bashy release`.
#
# This reproduces the asset names .github/workflows/release.yml has always
# produced, and those names are load-bearing beyond this repo: the umbrella's
# fleet-upgrade path resolves per-platform artifacts by name
# (`ycode-linux-arm64.tar.gz`, …), so renaming one strands hosts at the
# receiver's probe. Do not "tidy" the templates.
#
# Matrix note: this is the same five-target matrix as release.yml. All archives
# use tar.gz, including Windows, so the Bashy-only QA lane can extract every
# artifact without depending on a host unzip executable.
version: 2

project_name: ycode

builds:
  - id: ycode
    main: ./cmd/ycode
    binary: ycode
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    # No build tags: one YAML-native binary, no release variants.
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .Commit }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: ycode
    ids:
      - ycode
    # `ycode-linux-amd64.tar.gz` — the historical name, not goreleaser's default
    # (which would interpose the version and use x86_64/arm64 spellings).
    name_template: "ycode-{{ .Os }}-{{ .Arch }}"
    formats:
      - tar.gz
    # The archive holds the bare binary at its root, as `tar -czf … ycode` did.
    wrap_in_directory: false
    files: []

checksum:
  name_template: SHA256SUMS
  algorithm: sha256

snapshot:
  version_template: "{{ .Version }}-snapshot"
