name: release

# Two-stage release flow (mirrors the umbrella per-OS release gate; see
# docs/per-os-release-gate.md):
#
# 1. **`v*-dev` tag push (this workflow)**: build matrix → package → publish a
#    GitHub PRE-RELEASE with binaries and SHA256SUMS. The binary is stamped with
#    the BASE version (the `-dev` suffix is stripped) so `ycode version` reports
#    the version the bare tag will eventually carry. Per-OS QA pollers then run
#    `YCODE_TEST_VERSION=vX.Y.Z-dev bashy dag qa` against these exact bytes and
#    create refs/qa/<ver>/<os>.
#
# 2. **Bare `vX.Y.Z` tag push (promote.yml)**: byte-promotes the QA-tested
#    `-dev` pre-release assets to the official release — NO rebuild. This
#    workflow must NOT fire on a bare `v*` tag, or it would race promote.yml.
#
# 3. **Manual dispatch / PR touching this workflow**: dryrun. Build matrix
#    only — no Release is created. This is the gate that must pass green
#    before any new tag is created (see
#    feedback_no_tag_while_fixing in user memory: never tag to test a fix).
#
# Phase 2 unlock: prebuilt binaries are the prerequisite for brew/go install/
# npx wrappers. See docs/strategy.md#phase-2--on-ramp.
#
# Versioning: semver. Pre-1.0 = breaking changes expected. The `-dev` tag is
# always marked as a GitHub pre-release (promote.yml refuses a non-prerelease).

on:
  push:
    tags:
      # Build + publish a PRE-RELEASE only for exact vX.Y.Z-dev tags. Bare vX.Y.Z tags are
      # byte-promotions of QA-tested assets; see promote.yml.
      - 'v*-dev'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/release.yml'

permissions:
  contents: write  # required to create releases and upload assets

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            runs-on: ubuntu-latest
            goos: linux
            goarch: amd64
            ext: ""
          - target: linux-arm64
            # GitHub's free arm64 Linux runner (public repos). Builds
            # natively — no aarch64 cross-compile toolchain needed.
            runs-on: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            ext: ""
          - target: darwin-amd64
            runs-on: macos-15-intel
            goos: darwin
            goarch: amd64
            ext: ""
          - target: darwin-arm64
            runs-on: macos-latest
            goos: darwin
            goarch: arm64
            ext: ""
          - target: windows-amd64
            runs-on: windows-latest
            goos: windows
            goarch: amd64
            ext: ".exe"
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Bootstrap pinned sibling dependencies
        run: ./scripts/bootstrap-siblings.sh

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify feature registry
        run: go test -count=1 ./internal/features/...

      # Strip the -dev suffix so the binary is stamped with the BASE
      # version the bare tag will carry. `ycode version` on a v0.1.0-dev build
      # must report v0.1.0 — the per-OS qa target asserts this, and promote.yml
      # byte-promotes these bytes to the bare tag.
      - name: Normalize release version
        id: version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-dev$ ]] || {
              echo "::error::candidate tag must be exact semver vX.Y.Z-dev (got $tag)"
              exit 1
            }
            base="${tag%-dev}"
          else
            base="v0.0.0"
          fi
          echo "base=${base}" >> "$GITHUB_OUTPUT"

      - name: Build binary
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
          # The base version (stripped of -dev/-rc) for tag builds; the branch
          # name for dispatch/PR dryruns. The build step below appends -dryrun
          # to non-tag builds so the resulting binary's `ycode version` makes
          # it obvious this isn't a release artifact.
          VERSION: ${{ steps.version.outputs.base }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p dist
          BIN="dist/ycode-${{ matrix.target }}${{ matrix.ext }}"
          # Suffix non-tag builds with -dryrun so the resulting binary's
          # `ycode version` makes it obvious this isn't a release artifact.
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            VERSION="${VERSION}-dryrun"
          fi
          # One binary, no build tags — see DAG.md. This is the same command
          # `bashy dag compile` and scripts/gate.sh run; keep the three in step.
          go build -trimpath \
            -ldflags "-s -w -X main.version=${VERSION} -X main.commit=${COMMIT}" \
            -o "$BIN" ./cmd/ycode/
          # Ad-hoc codesign on macOS so binaries don't get killed by Gatekeeper.
          if [ "$RUNNER_OS" = "macOS" ]; then
            codesign -f -s - "$BIN" 2>/dev/null || true
          fi
          ls -la "$BIN"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ycode-${{ matrix.target }}
          path: dist/ycode-${{ matrix.target }}${{ matrix.ext }}
          if-no-files-found: error
          retention-days: 1

  # Packages artifacts on every successful build (tag, dispatch, or PR) so
  # the workflow's packaging logic itself is exercised on dryruns. The
  # publish step below is gated to tag pushes only.
  package:
    name: package
    needs: build
    runs-on: ubuntu-latest
    outputs:
      is_release: ${{ steps.flags.outputs.is_release }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Compute release flags
        id: flags
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package archives + checksums
        run: |
          set -euo pipefail
          mkdir -p release-assets

          # Per-platform archives. Existing Unix asset names are load-bearing;
          # Windows intentionally uses the same tar.gz convention so QA needs
          # no host unzip dependency.
          for dir in artifacts/ycode-*; do
            target=$(basename "$dir" | sed 's/^ycode-//')
            cd "$dir"
            if [[ "$target" == windows-* ]]; then
              cp "ycode-${target}.exe" ycode.exe
              tar -czf "../../release-assets/ycode-${target}.tar.gz" ycode.exe
              rm ycode.exe
            else
              cp "ycode-${target}" ycode
              chmod +x ycode
              tar -czf "../../release-assets/ycode-${target}.tar.gz" ycode
              rm ycode
            fi
            cd ../..
          done

          cd release-assets
          sha256sum *.tar.gz > SHA256SUMS
          ls -la

      - name: Upload packaged assets (dryrun visibility)
        uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: release-assets/
          retention-days: 7

  publish:
    name: publish release
    needs: package
    if: needs.package.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: release-assets

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --prerelease \
            --title "$TAG" \
            --generate-notes \
            release-assets/*
